[project]
name = "retirement-planner"
version = "0.1.0"
description = "Planificateur de retraite professionnel (Canada) — moteur de simulation, analyses de décaissement et outils d'objectifs"
requires-python = ">=3.11"
dependencies = ["nicegui>=2.0", "plotly>=5.0", "pandas>=2.0", "reportlab>=4.0", "kaleido>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
retirement-planner = "gui.main:run_app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["planner*", "gui*"]

[tool.setuptools.package-data]
planner = ["data/**/*.json"]
